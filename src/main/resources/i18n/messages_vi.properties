# Base & Common Exceptions
org.oplearn.project.exception.base.BadRequestException=Yêu cầu không hợp lệ
org.oplearn.project.exception.base.ConflictException=%objectName% với id %id% đã tồn tại
org.oplearn.project.exception.base.NotFoundException=Không tìm thấy %objectName% với id %id%
org.oplearn.project.exception.base.InternalServerError=Hệ thống đang gặp sự cố, vui lòng thử lại sau ít phút
org.oplearn.project.exception.base.UnauthorizedException=Bạn cần đăng nhập để thực hiện thao tác này
org.oplearn.project.exception.UserUnauthorizedException=Bạn không có quyền thực hiện thao tác này

# User & Auth Exceptions
org.oplearn.project.exception.UserNotFoundException=Không tìm thấy người dùng
org.oplearn.project.exception.UsernameAlreadyExistedException=Tên đăng nhập này đã có người sử dụng, vui lòng chọn tên khác
org.oplearn.project.exception.EmailAlreadyExistedException=Email này đã được đăng ký, vui lòng dùng email khác
org.oplearn.project.exception.InvalidCredentialException=Tên đăng nhập hoặc mật khẩu không chính xác
org.oplearn.project.exception.InvalidRefreshTokenException=Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại
org.oplearn.project.exception.InvalidOtpException=Mã OTP không chính xác
org.oplearn.project.exception.OtpExpiredException=Mã OTP đã hết hạn hoặc không tồn tại
org.oplearn.project.exception.ProtectedAccountException=Đây là tài khoản hệ thống được bảo vệ, chỉ chính chủ mới được sửa

