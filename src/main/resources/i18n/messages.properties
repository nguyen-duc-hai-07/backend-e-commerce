# Base & Common Exceptions
org.oplearn.project.exception.base.BadRequestException=Bad request
org.oplearn.project.exception.base.ConflictException=Resource %objectName% with id %id% already exists
org.oplearn.project.exception.base.NotFoundException=Resource %objectName% with id %id% not found
org.oplearn.project.exception.base.InternalServerError=Internal server error, please try again later
org.oplearn.project.exception.base.UnauthorizedException=Unauthorized
org.oplearn.project.exception.UserUnauthorizedException=You do not have permission to perform this action

# User & Auth Exceptions
org.oplearn.project.exception.UserNotFoundException=User not found
org.oplearn.project.exception.UsernameAlreadyExistedException=Username already exists
org.oplearn.project.exception.EmailAlreadyExistedException=Email already exists
org.oplearn.project.exception.InvalidCredentialException=Invalid username or password
org.oplearn.project.exception.InvalidRefreshTokenException=Refresh token is invalid or expired
org.oplearn.project.exception.InvalidOtpException=Invalid OTP code
org.oplearn.project.exception.OtpExpiredException=OTP code has expired or does not exist
org.oplearn.project.exception.ProtectedAccountException=This is a protected system account and can only be edited by its owner

